# docker-compose.yml
version: '3.8' # Keep this version line. The warning is just informational.

services:
  # --- NEW: Redis service for Celery broker ---
  redis:
    image: redis:7-alpine # Use a lightweight Redis image
    ports:
      - "6379:6379" # Expose Redis port if you want to access it directly from host (optional for internal Docker use)
    #volumes: # Uncomment if you want Redis data to persist across container restarts (e.g., when trying out Celery Beat)
    #  redis_data:/data 

  # Service for HTTP API and Static Files (Django's runserver)
  django_http:
    build: . # Build from the Dockerfile in the current directory
    command: python manage.py runserver 0.0.0.0:8888 # Command to run HTTP server
    volumes:
      - ./realestate:/app/realestate # Mount the host's 'realestate' subdirectory into the container
      - media_data:/app/realestate/media # Persist media files (user uploads)
    ports:
      - "127.0.0.1:9999:8888" # Map host port 8000 to container port 8000
    env_file:
      - ./realestate/.env # Load environment variables from .env file
    depends_on:
      - redis # <--- NEW: Depend on Redis (django_http needs Redis for Celery tasks eventually)

  # Service for WebSocket connections (Daphne)
  django_websocket:
    build: . # Build from the Dockerfile in the current directory
    command: daphne -b 0.0.0.0 -p 8889 realestate.asgi:application  # Command to run Daphne
    volumes:
      - ./realestate:/app/realestate # Mount the host's 'realestate' subdirectory into the container
      - media_data:/app/realestate/media # Share media files volume with http service
    ports:
      - "127.0.0.1:9998:8889" # Map host port 8001 to container port 8001
    env_file:
      - ./realestate/.env # Load environment variables from .env file
    depends_on:
      - django_http # Ensures HTTP server is up if WebSocket requires it
      - redis # <--- NEW: Depend on Redis (even if Channels uses InMemoryLayer, good for futureproofing)

  # --- NEW: Celery Worker Service ---
  celery_worker:
    build: . # Build from the same Dockerfile
    command: celery -A realestate worker -l info # Command to run Celery worker. realestate is your project name.
    volumes:
      - ./realestate:/app/realestate # Mount the Django project code for the worker
    env_file:
      - ./realestate/.env # Load environment variables
    depends_on:
      - redis # <--- Worker absolutely depends on the Redis broker
      - django_http # Worker should wait for Django app to be ready (DB, models loaded)
    # This service typically does not need to expose any ports to the host

# Define volumes for persistent data
volumes:
  media_data: # This volume will store user-uploaded media files persistently
  # redis_data: # Uncomment if you enabled redis_data volume in the redis service above