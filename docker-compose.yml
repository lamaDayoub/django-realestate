version: '3.8'

services:
  # Redis as message broker for Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"  # Optional: only needed if debugging from host
    # volumes:
    #   - redis_data:/data

  # Django HTTP server (runserver)
  django_http:
    build: .
    command: python manage.py runserver 0.0.0.0:8888
    volumes:
      - ./realestate:/app/realestate
      - media_data:/app/realestate/media
    ports:
      - "9999:8888"  
    env_file:
      - ./realestate/.env
    depends_on:
      - redis
    restart: unless-stopped

  # Daphne for WebSockets (ASGI)
  django_websocket:
    build: .
    command: daphne -b 0.0.0.0 -p 8889 realestate.asgi:application
    volumes:
      - ./realestate:/app/realestate
      - media_data:/app/realestate/media
    ports:
      - "9998:8889"  
    env_file:
      - ./realestate/.env
    depends_on:
      - django_http
      - redis
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build: .
    command: celery -A realestate worker -l info
    volumes:
      - ./realestate:/app/realestate
    env_file:
      - ./realestate/.env
    depends_on:
      - redis
      - django_http
    restart: unless-stopped

# Named volumes for persistence
volumes:
  media_data:
  # redis_data:  # Uncomment if you want Redis persistence